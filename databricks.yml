# This is a Declarative Automation Bundle definition for learn_databricks.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: learn_databricks
  uuid: b8310486-db89-4f1b-b026-e8c3779dd2d4

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-6ef3bcab-62d1.cloud.databricks.com
    variables:
      catalog: chaves
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-6ef3bcab-62d1.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/jorgehbchaves@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/jorgehbchaves@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: chaves
      schema: prod
    permissions:
      - user_name: jorgehbchaves@gmail.com
        level: CAN_MANAGE
